<svg width="480" height="160" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { color-scheme: light dark; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .primary { fill: #1f2328; }
    .secondary { fill: #59636e; }
    .accent { fill: #0969da; }
    .rule { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #30363d; }
      .primary { fill: #f0f6fc; }
      .secondary { fill: #9198a1; }
      .accent { fill: #58a6ff; }
      .rule { stroke: #30363d; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect class="panel" x="1" y="1" width="478" height="158" rx="12"/>
  <text class="primary" x="16" y="28" font-size="17" font-weight="650">Weather in {{city}}</text>
  <text class="secondary" x="16" y="45" font-size="10">Updated {{current_time}}</text>
  <text class="accent" x="16" y="91" font-size="39" font-weight="700">{{temperature}}°C</text>
  <text class="secondary" x="16" y="108" font-size="12">{{weather_type}} · Feels like {{feels_like}}°C</text>
  <image x="377" y="42" width="80" height="80" href="data:image/png;base64,{{image}}"/>
  <line class="rule" x1="16" y1="117" x2="464" y2="117"/>
  <text class="secondary" x="16" y="133" font-size="11">Low {{min_temperature}}°C · High {{max_temperature}}°C</text>
  <text class="secondary" x="16" y="149" font-size="11">Sunrise {{sunrise}} · Sunset {{sunset}}</text>
</svg>
