<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { color-scheme: light dark; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .primary { fill: #1f2328; }
    .secondary { fill: #59636e; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #30363d; }
      .primary { fill: #f0f6fc; }
      .secondary { fill: #9198a1; }
      .accent { fill: #58a6ff; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect class="panel" x="1" y="1" width="498" height="198" rx="12"/>
  <text class="primary" x="20" y="32" font-size="19" font-weight="650">Weather in {{city}}</text>
  <text class="secondary" x="20" y="52" font-size="11">Updated {{current_time}}</text>
  <text class="accent" x="20" y="109" font-size="43" font-weight="700">{{temperature}}°C</text>
  <text class="secondary" x="20" y="131" font-size="13">{{weather_type}} · Feels like {{feels_like}}°C</text>
  <image x="385" y="55" width="90" height="90" href="data:image/png;base64,{{image}}"/>
  <line x1="20" y1="147" x2="480" y2="147" stroke="#8b949e" stroke-opacity=".35"/>
  <text class="secondary" x="20" y="169" font-size="12">Low {{min_temperature}}°C  ·  High {{max_temperature}}°C</text>
  <text class="secondary" x="20" y="188" font-size="12">Sunrise {{sunrise}}  ·  Sunset {{sunset}}</text>
</svg>
